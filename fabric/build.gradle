plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

repositories {
    maven { name = "Ladysnake"; url = "https://maven.ladysnake.org/releases" }
    maven { name = "Terraformers"; url = "https://maven.terraformersmc.com/releases/" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"


    // Cardinal Components - modImplementation makes it work in dev, include puts it in the JAR
    modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-base:6.1.0"
    modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-world:6.1.0"
    include "dev.onyxstudios.cardinal-components-api:cardinal-components-base:6.1.0"
    include "dev.onyxstudios.cardinal-components-api:cardinal-components-world:6.1.0"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}